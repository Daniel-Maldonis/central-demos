<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Demonstrações | Daniel Maldonis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(20, 27, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --badge-bg: rgba(59, 130, 246, 0.15);
      --badge-text: #60a5fa;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 45%);
      padding: 2.5rem 1.5rem;
    }

    .container { max-width: 1280px; margin: 0 auto; }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 2rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .brand { display: flex; align-items: center; gap: 0.85rem; }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.3rem;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .brand-title h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-title p { font-size: 0.875rem; color: var(--text-muted); }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      padding: 0.45rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    .stats-bar {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-item strong {
      color: var(--text-main);
      font-size: 1rem;
      margin-right: 0.25rem;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      max-width: 440px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      color: var(--text-main);
      font-size: 0.925rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .filter-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 0.95rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 1.75rem;
    }

    .demo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      backdrop-filter: blur(12px);
    }

    .demo-card:hover {
      transform: translateY(-4px);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      padding: 1.25rem 1.5rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .card-badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.3rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #93c5fd;
    }

    .badge-mcp {
      background: rgba(168, 85, 247, 0.15);
      border-color: rgba(168, 85, 247, 0.3);
      color: #c084fc;
    }

    .card-body {
      padding: 0.5rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      margin-bottom: 1.25rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-meta code {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      color: #cbd5e1;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #2563eb; }

    .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.06); }

    .btn-copy {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .btn-copy:hover { background: #10b981; color: #fff; }

    .btn-proposta {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }
    .btn-proposta:hover { background: #d97706; color: #fff; }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #fff;
      padding: 0.85rem 1.4rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }

    .phone-frame {
      width: 380px;
      height: 720px;
      max-height: 90vh;
      background: #000;
      border-radius: 40px;
      border: 8px solid #27272a;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .phone-header {
      background: #18181b;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .phone-iframe { flex: 1; width: 100%; border: none; background: #fff; }

    .close-modal {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <div class="brand">
          <div class="brand-logo">DM</div>
          <div class="brand-title">
            <h1>Central de Demonstrações</h1>
            <p>Portal Exclusivo de Apresentações de Clientes &middot; Daniel Maldonis</p>
          </div>
        </div>
        <div class="badge-status">
          <span class="badge-dot"></span>
          Ambiente Ativo na Vercel
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-item"><strong id="totalCount">22</strong> Total de Demos</div>
        <div class="stat-item"><strong id="mcpCount">14</strong> Leads MCP (Exterior)</div>
        <div class="stat-item"><strong>100%</strong> Compatível Vercel / GitHub</div>
      </div>
    </header>

    <div class="controls">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por cliente, especialidade ou nicho...">
      </div>

      <div class="filter-tags">
        <button class="filter-btn active" data-filter="all">Todos (22)</button>
        <button class="filter-btn" data-filter="MCP">Leads MCP (14)</button>
        <button class="filter-btn" data-filter="Saúde">Saúde & Fitness (4)</button>
        <button class="filter-btn" data-filter="Serviços">Serviços & Negócios (4)</button>
      </div>
    </div>

    <div class="grid" id="demosGrid"></div>
  </div>

  <div id="toast" class="toast">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
    </svg>
    <span id="toastMsg">Link exclusivo copiado! Pronto para enviar.</span>
  </div>

  <div id="modalOverlay" class="modal-overlay" onclick="closePhoneModal(event)">
    <button class="close-modal" onclick="closePhoneModal(event)">&times;</button>
    <div class="phone-frame" onclick="event.stopPropagation()">
      <div class="phone-header">
        <span>Simulação Mobile</span>
        <span id="phoneUrl">/clientes/...</span>
      </div>
      <iframe id="phoneIframe" class="phone-iframe" src=""></iframe>
    </div>
  </div>

  <script>
    const projects = [
      // Leads MCP Exterior
      { name: "Aguila Electrical", slug: "aguila-electrical", category: "MCP", niche: "Elétrica (EUA)", desc: "Redesign premium para empresa de eletricidade residencial e comercial.", hasProposta: true },
      { name: "Associated Piping Services", slug: "associated-piping-services", category: "MCP", niche: "Encanamento (EUA)", desc: "Landing page focada em serviços emergenciais e reparos hidráulicos.", hasProposta: true },
      { name: "Comfort One A/C", slug: "comfort-one-ac", category: "MCP", niche: "Climatização HVAC (EUA)", desc: "Página de conversão para manutenção e instalação de ar condicionado.", hasProposta: true },
      { name: "Desert Comfort Mechanical", slug: "desert-comfort-mechanical", category: "MCP", niche: "Climatização HVAC (EUA)", desc: "Design focado em agendamento rápido de revisão e troca de filtros.", hasProposta: true },
      { name: "Greenway Plumbing", slug: "greenway-plumbing", category: "MCP", niche: "Encanamento (EUA)", desc: "Redesign moderno com avaliações reais e chamada para cotação rápida.", hasProposta: true },
      { name: "Honest Hank's Electrician", slug: "honest-hanks-electrician", category: "MCP", niche: "Elétrica (EUA)", desc: "Página com forte prova social e foco em atendimento residencial seguro.", hasProposta: true },
      { name: "Jeff's KBB Plumbing", slug: "jeffs-kbb-plumbing", category: "MCP", niche: "Encanamento (EUA)", desc: "Landing page profissional com destaque para serviços especializados.", hasProposta: false },
      { name: "Lightning Bay Electric", slug: "lightning-bay-electric", category: "MCP", niche: "Elétrica (EUA)", desc: "Visual moderno para serviços elétricos de alta confiabilidade.", hasProposta: true },
      { name: "Meridian A/C", slug: "meridian-ac", category: "MCP", niche: "Climatização HVAC (EUA)", desc: "Landing page focada em conforto térmico e atendimento 24/7.", hasProposta: true },
      { name: "Prestige A/C", slug: "prestige-ac", category: "MCP", niche: "Climatização HVAC (EUA)", desc: "Site elegante para climatização premium residencial e predial.", hasProposta: true },
      { name: "Reali Electric", slug: "reali-electric", category: "MCP", niche: "Elétrica (EUA)", desc: "Redesign de alto padrão com destaque para certificações e segurança.", hasProposta: true },
      { name: "Roofer Orlando", slug: "roofer-orlando", category: "MCP", niche: "Telhados & Roofing (EUA)", desc: "Página focada em orçamentos para reformas e inspeções de telhados.", hasProposta: false },
      { name: "Smooth Sailing Electric", slug: "smooth-sailing-electric", category: "MCP", niche: "Elétrica (EUA)", desc: "Página de conversão rápida com avaliações e garantias de serviço.", hasProposta: true },
      { name: "Western Sky Mechanical", slug: "western-sky-mechanical", category: "MCP", niche: "Climatização HVAC (EUA)", desc: "Design técnico e confiável para sistemas de climatização industrial.", hasProposta: true },
      
      // Projetos de Saúde & Fitness
      { name: "Clínica Sorriso", slug: "clinica-sorriso-exemplo", category: "Saúde", niche: "Odontologia", desc: "Design focado em agendamento de implantes e alinhadores via WhatsApp.", hasProposta: false },
      { name: "Consultório de Nutrição", slug: "nutricionista", category: "Saúde", niche: "Nutrição Clínica", desc: "Landing page humanizada com planos nutricionais e acompanhamento.", hasProposta: false },
      { name: "Personal Trainer Elite", slug: "personal-trainer", category: "Saúde", niche: "Fitness & Performance", desc: "Site esportivo moderno com foco em consultoria personalizada.", hasProposta: false },
      { name: "Psicologia Clínica", slug: "psicologia-clinica", category: "Saúde", niche: "Saúde Mental", desc: "Página acolhedora e ética para agendamento de sessões online e presenciais.", hasProposta: false },

      // Serviços & Negócios Locais
      { name: "Barbearia Vintage Club", slug: "barbearia-vintage-exemplo", category: "Serviços", niche: "Beleza & Estética", desc: "Design clássico com tabela de serviços, preços e agendamento rápido.", hasProposta: false },
      { name: "Metalcore Usinagem", slug: "metalcore-usinagem", category: "Serviços", niche: "Indústria & Usinagem", desc: "Site institucional completo com páginas de serviços, projetos e contato.", hasProposta: false },
      { name: "Restaurante Casa Lume", slug: "restaurante-casa-lume", category: "Serviços", niche: "Gastronomia", desc: "Experiência visual sofisticada com cardápio e reservas de mesa.", hasProposta: false },
      { name: "Projeto Elevare", slug: "projeto-elevare", category: "Serviços", niche: "Arquitetura & Engenharia", desc: "Apresentação moderna de projetos arquitetônicos e portfólio de obras.", hasProposta: false }
    ];

    const grid = document.getElementById('demosGrid');

    function renderCards(list) {
      grid.innerHTML = '';
      list.forEach(item => {
        const isMcp = item.category === 'MCP';
        const card = document.createElement('article');
        card.className = 'demo-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="card-badge ${isMcp ? 'badge-mcp' : ''}">${item.niche}</span>
            ${item.hasProposta ? '<span class="card-badge" style="background:rgba(245,158,11,0.15); border-color:rgba(245,158,11,0.3); color:#fbbf24;">Antes / Depois</span>' : ''}
          </div>
          <div class="card-body">
            <h2 class="card-title">${item.name}</h2>
            <p class="card-desc">${item.desc}</p>
            <div class="card-meta">
              <span>Status: <strong>Pronto</strong></span>
              <code>/clientes/${item.slug}</code>
            </div>
            <div class="card-actions">
              <a href="./clientes/${item.slug}/" target="_blank" class="btn btn-primary">Abrir Site</a>
              <button class="btn btn-outline" onclick="openPhoneModal('./clientes/${item.slug}/')">Mobile</button>
              <button class="btn btn-copy" onclick="copyClientLink('clientes/${item.slug}/')">Copiar Link</button>
              ${item.hasProposta ? `<a href="./clientes/${item.slug}/proposta.html" target="_blank" class="btn btn-proposta">Ver Proposta</a>` : `<button class="btn btn-outline" onclick="copyClientLink('clientes/${item.slug}/')">Link Direto</button>`}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    renderCards(projects);

    function copyClientLink(subpath) {
      const fullUrl = new URL(subpath, window.location.href).href;
      navigator.clipboard.writeText(fullUrl).then(() => {
        showToast('Link do cliente copiado: ' + fullUrl);
      }).catch(() => {
        showToast('Erro ao copiar link');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    function openPhoneModal(url) {
      const modal = document.getElementById('modalOverlay');
      const iframe = document.getElementById('phoneIframe');
      const label = document.getElementById('phoneUrl');
      iframe.src = url;
      label.textContent = url;
      modal.classList.add('active');
    }

    function closePhoneModal(e) {
      const modal = document.getElementById('modalOverlay');
      const iframe = document.getElementById('phoneIframe');
      iframe.src = '';
      modal.classList.remove('active');
    }

    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');

    searchInput.addEventListener('input', applyFilters);

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilters();
      });
    });

    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();
      const activeFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');

      const filtered = projects.filter(item => {
        const matchesQuery = item.name.toLowerCase().includes(query) || 
                             item.desc.toLowerCase().includes(query) || 
                             item.niche.toLowerCase().includes(query);
        const matchesCat = (activeFilter === 'all') || (item.category === activeFilter);
        return matchesQuery && matchesCat;
      });

      renderCards(filtered);
    }
  </script>
</body>
</html>
